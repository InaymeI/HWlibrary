[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maximumtest-desktop"
version = "0.5.6"
description = "Desktop viewer for MaximumTest homework with a local SQLite cache"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
maximumtest = "mt.__main__:main"

[project.gui-scripts]
maximumtest-gui = "mt.__main__:main"

[tool.setuptools]
packages = ["mt", "mt.ui"]

[tool.setuptools.package-data]
mt = ["assets/aero/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:mt.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
